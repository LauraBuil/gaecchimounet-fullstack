project_id = "gaec-chimounet"

[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]

[db]
major_version = 17

[db.seed]
enabled = false

[auth]
enabled = true
site_url = "https://staging.gaecchimounet.fr"
additional_redirect_urls = [
  "https://staging.gaecchimounet.fr/admin/mot-de-passe",
  "https://gaecchimounet.fr/admin/mot-de-passe",
  "https://www.gaecchimounet.fr/admin/mot-de-passe",
  "http://localhost:5173/admin/mot-de-passe",
]
enable_signup = false

[storage]
enabled = true

[functions.manage-users]
verify_jwt = true

[functions.kuupanda-catalog]
verify_jwt = false
